          - list [ref=f25e109]:
            - listitem [ref=f25e110]: "Step 1: Differentiate term by term. d/dx(3x²) = 6x, d/dx(2x) = 2, d/dx(−5) = 0."
            - listitem [ref=f25e111]: "Step 2: So f′(x) = 6x + 2."
            - listitem [ref=f25e112]: "Step 3: Substitute x = 1: f′(1) = 6(1) + 2 = 8."
        - generic [ref=f25e113]:
          - heading "Why not the others?" [level=3] [ref=f25e114]
          - list [ref=f25e115]:
            - listitem [ref=f25e116]: A (6) forgets the derivative of 2x — it only evaluates 6x at x = 1.
            - listitem [ref=f25e117]: C (10) adds the constant −5 back in, but constants differentiate to 0.
            - listitem [ref=f25e118]: D (5) is the value f(0) = −5 confused with a derivative, not f′(1).
