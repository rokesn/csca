    - region "Stage 1 Learn" [ref=f35e40]:
      - heading "Stage 1 — Learn" [level=2] [ref=f35e41]
      - generic [ref=f35e42]:
        - heading "Why this matters" [level=3] [ref=f35e43]
        - paragraph [ref=f35e44]: "Derivative rules are CSCA's calculus engine: tangents, monotonicity, and every optimization item reduce to differentiating correctly and fast."
      - heading "Key points" [level=3] [ref=f35e45]
      - list [ref=f35e47]:
        - listitem [ref=f35e48]: "Classify the structure before differentiating: single power → power rule, product → product rule, quotient → quotient rule, nested → chain rule."
        - listitem [ref=f35e49]: "Chain rule multiplies rates layer by layer: derivative of the outside at the inside, times the derivative of the inside — repeat for triple nesting."
        - listitem [ref=f35e50]: "Memorize the transcendental five: eˣ reproduces, ln x gives 1/x, sin ↔ cos with the minus on (cos)′, plus aˣ ln a and tan → sec²."
        - listitem [ref=f35e51]: Simplify first (expand products, split quotients, convert roots to fractional powers) so the power rule handles more terms directly.
        - listitem [ref=f35e52]: Read f′(a) geometrically as the tangent slope at a and physically as the instantaneous rate of change of f at a.
      - heading "Formulas" [level=3] [ref=f35e53]
      - list [ref=f35e54]:
        - listitem [ref=f35e55]: (xⁿ)′ = n·xⁿ⁻¹
        - listitem [ref=f35e56]: (uv)′ = u′v + uv′
        - listitem [ref=f35e57]: (u/v)′ = (u′v − uv′)/v²
        - listitem [ref=f35e58]: "[f(g(x))]′ = f′(g(x)) · g′(x)"
        - listitem [ref=f35e59]: (eˣ)′ = eˣ; (ln x)′ = 1/x; (sin x)′ = cos x; (cos x)′ = −sin x
        - listitem [ref=f35e60]: (c)′ = 0; (cu)′ = cu′; (u ± v)′ = u′ ± v′
        - listitem [ref=f35e61]: (tan x)′ = sec²x; (aˣ)′ = aˣ ln a; (log_a x)′ = 1/(x ln a)
        - listitem [ref=f35e62]: f′(a) = lim(h→0)(f(a+h) − f(a))/h — slope of tangent at a
      - generic [ref=f35e64]:
        - paragraph [ref=f35e65]: Classic traps
        - list [ref=f35e67]:
          - listitem [ref=f35e68]: Dropping the inner derivative in the chain rule, e.g. writing (sin(x²))′ = cos(x²).
          - listitem [ref=f35e69]: Swapping quotient-rule order to (uv′ − u′v)/v² or forgetting to square the denominator.
          - listitem [ref=f35e70]: Writing (ln x)′ = 1/x without restricting x > 0, or (xⁿ)′ = nxⁿ without lowering the exponent.
          - listitem [ref=f35e71]: Applying product/quotient rules to compositions (or vice versa) instead of naming the outer structure first.
      - generic [ref=f35e73]:
        - paragraph [ref=f35e74]: Exam tip
        - generic [ref=f35e75]: Circle the outer function and box the inner one before writing anything — visible nesting makes the missing ×g′(x) factor almost impossible to drop.
      - 'button "Next: See worked examples →" [ref=f35e76] [cursor=pointer]'
