          - heading "How registration works" [level=2] [ref=f20e178]
          - list [ref=f20e179]:
            - listitem [ref=f20e180]:
              - paragraph [ref=f20e181]: 1 · Account + subjects
              - paragraph [ref=f20e182]: Register on csca.cn, pick subjects before paying — 2+ subjects in one sitting costs ¥700 total vs ¥450 for one.
            - listitem [ref=f20e183]:
              - paragraph [ref=f20e184]: 2 · Pay
              - paragraph [ref=f20e185]: Alipay, WeChat Pay, or bank transfer. Keep the receipt.
            - listitem [ref=f20e186]:
              - paragraph [ref=f20e187]: 3 · Ticket + software
              - paragraph [ref=f20e188]: From Registration – My CSCA download the admission ticket and the latest test software (delete old versions first).
            - listitem [ref=f20e189]:
              - paragraph [ref=f20e190]: 4 · System test
              - paragraph [ref=f20e191]: Run the personal equipment/network check in the announced window (e.g. a few days before exam day, typically afternoons).
            - listitem [ref=f20e192]:
              - paragraph [ref=f20e193]: 5 · Exam day login
              - paragraph [ref=f20e194]: Log in 1 hour early; finish equipment check, facial recognition and manual verification ≥15 min before each paper.
          - paragraph [ref=f20e195]: "Bring: ID photo, valid ID, and a working payment method — see the full requirements list on csca.cn."
