    - region "Stage 1 Learn" [ref=f32e38]:
      - heading "Stage 1 — Learn" [level=2] [ref=f32e39]
      - generic [ref=f32e40]:
        - heading "Why this matters" [level=3] [ref=f32e41]
        - paragraph [ref=f32e42]: "Derivative rules are CSCA's calculus engine: tangents, monotonicity, and every optimization item reduce to differentiating correctly and fast."
      - heading "Key points" [level=3] [ref=f32e43]
      - list [ref=f32e44]:
        - listitem [ref=f32e45]: "Classify the structure before differentiating: single power → power rule, product → product rule, quotient → quotient rule, nested → chain rule."
        - listitem [ref=f32e46]: "Chain rule multiplies rates layer by layer: derivative of the outside at the inside, times the derivative of the inside — repeat for triple nesting."
        - listitem [ref=f32e47]: "Memorize the transcendental five: eˣ reproduces, ln x gives 1/x, sin ↔ cos with the minus on (cos)′, plus aˣ ln a and tan → sec²."
        - listitem [ref=f32e48]: Simplify first (expand products, split quotients, convert roots to fractional powers) so the power rule handles more terms directly.
        - listitem [ref=f32e49]: Read f′(a) geometrically as the tangent slope at a and physically as the instantaneous rate of change of f at a.
      - heading "Formulas" [level=3] [ref=f32e50]
      - list [ref=f32e51]:
        - listitem [ref=f32e52]: (xⁿ)′ = n·xⁿ⁻¹
        - listitem [ref=f32e53]: (uv)′ = u′v + uv′
        - listitem [ref=f32e54]: (u/v)′ = (u′v − uv′)/v²
        - listitem [ref=f32e55]: "[f(g(x))]′ = f′(g(x)) · g′(x)"
        - listitem [ref=f32e56]: (eˣ)′ = eˣ; (ln x)′ = 1/x; (sin x)′ = cos x; (cos x)′ = −sin x
        - listitem [ref=f32e57]: (c)′ = 0; (cu)′ = cu′; (u ± v)′ = u′ ± v′
        - listitem [ref=f32e58]: (tan x)′ = sec²x; (aˣ)′ = aˣ ln a; (log_a x)′ = 1/(x ln a)
        - listitem [ref=f32e59]: f′(a) = lim(h→0)(f(a+h) − f(a))/h — slope of tangent at a
      - generic [ref=f32e60]:
        - heading "Classic traps" [level=3] [ref=f32e61]
        - list [ref=f32e62]:
          - listitem [ref=f32e63]: Dropping the inner derivative in the chain rule, e.g. writing (sin(x²))′ = cos(x²).
          - listitem [ref=f32e64]: Swapping quotient-rule order to (uv′ − u′v)/v² or forgetting to square the denominator.
          - listitem [ref=f32e65]: Writing (ln x)′ = 1/x without restricting x > 0, or (xⁿ)′ = nxⁿ without lowering the exponent.
          - listitem [ref=f32e66]: Applying product/quotient rules to compositions (or vice versa) instead of naming the outer structure first.
      - generic [ref=f32e67]:
        - heading "Exam tip" [level=3] [ref=f32e68]
        - paragraph [ref=f32e69]: Circle the outer function and box the inner one before writing anything — visible nesting makes the missing ×g′(x) factor almost impossible to drop.
      - 'button "Next: See worked examples →" [ref=f32e70] [cursor=pointer]'
